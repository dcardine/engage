<title>Frosthold Outpost</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800&display=swap">
<style>
/* Layout: full-bleed 3D canvas, HUD chips pinned to the corners, objective card top-left. Single deliberate frosty look. */
:root{
  --ice:#e9eff8; --ink:#16233a; --panel:rgba(18,30,50,.74); --panel-line:rgba(255,255,255,.18);
  --ember:#ff8a3d; --cash:#43b96a; --wood:#a8693f; --meat:#d9524b; --gold:#f2c14e; --hp:#e2483f;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;background:var(--ice);color:var(--ink);overflow:hidden;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:var(--body)}
[hidden]{display:none!important}
#game{position:fixed;inset:0;background:var(--ice)}
#game canvas{display:block;width:100%;height:100%}
#ov{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.hud{position:fixed;pointer-events:none;z-index:5}
#res{top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.chip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;
  padding:4px 12px 4px 6px;min-width:86px;justify-content:space-between;color:#fff;font:22px/1 var(--display);
  font-variant-numeric:tabular-nums;letter-spacing:.02em;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.chip.bump{animation:bump .18s ease-out}
@keyframes bump{50%{transform:scale(1.12)}}
.ico{width:28px;height:22px;display:block;flex:none}
#brand{top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;max-width:min(58vw,300px)}
#logo{font:30px/0.9 var(--display);color:#fff;letter-spacing:.03em;
  text-shadow:0 3px 0 #2b4a74,0 5px 10px rgba(20,40,70,.35);-webkit-text-stroke:1.5px #2b4a74}
#logo small{display:block;font-size:15px;color:var(--ember);-webkit-text-stroke:1px #6b2f0c;letter-spacing:.18em;margin-top:4px}
#quest{background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;padding:8px 12px;color:#fff;
  font:800 14px/1.3 var(--body);text-wrap:balance}
#quest b{display:block;font:13px/1 var(--display);letter-spacing:.12em;color:var(--ember);margin-bottom:4px;text-transform:uppercase}
#defense{display:flex;flex-direction:column;gap:5px;background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;padding:8px 12px;color:#fff;font:800 12px/1 var(--body)}
#defense .row{display:flex;justify-content:space-between;gap:10px;letter-spacing:.06em;text-transform:uppercase}
#defense .bar{height:8px;border-radius:5px;background:rgba(255,255,255,.18);overflow:hidden}
#defense .bar i{display:block;height:100%;background:linear-gradient(90deg,#f3b13f,#58c46d);width:100%;transition:width .2s}
#banner{top:30%;left:50%;transform:translate(-50%,-50%) scale(.9);opacity:0;transition:all .25s;font:34px/1 var(--display);color:#fff;
  text-shadow:0 3px 0 #7a1d16,0 6px 18px rgba(0,0,0,.35);-webkit-text-stroke:1.5px #7a1d16;white-space:nowrap;text-align:center}
#banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#banner.good{text-shadow:0 3px 0 #1d5a33,0 6px 18px rgba(0,0,0,.3);-webkit-text-stroke-color:#1d5a33}
#mute{pointer-events:auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));right:calc(14px + env(safe-area-inset-right,0px));
  width:44px;height:44px;border-radius:50%;border:1px solid var(--panel-line);background:var(--panel);color:#fff;font:18px/1 var(--display);cursor:pointer}
#mute:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
#hint{bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);color:var(--ink);opacity:.7;
  font:800 13px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;transition:opacity .6s;white-space:nowrap}
#joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(22,35,58,.16);
  border:2px solid rgba(255,255,255,.7);pointer-events:none;display:none;z-index:6}
#joy i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.ft{position:absolute;left:0;top:0;font:20px/1 var(--display);color:#fff;white-space:nowrap;
  text-shadow:0 2px 0 rgba(0,0,0,.45);-webkit-text-stroke:1px rgba(0,0,0,.35);will-change:transform}
.ft.cash{color:#7cf0a0}.ft.warn{color:#ffd166}.ft.bad{color:#ff8b7e}
.bar3{position:absolute;left:0;top:0;width:54px;height:8px;border-radius:5px;background:rgba(20,25,35,.55);overflow:hidden;border:1.5px solid rgba(255,255,255,.8)}
.bar3 i{display:block;height:100%;background:var(--hp)}
.bubble{position:absolute;left:0;top:0;display:flex;align-items:center;gap:4px;padding:4px 9px 4px 5px;border-radius:16px;background:#fff;
  color:var(--ink);font:20px/1 var(--display);box-shadow:0 3px 0 rgba(0,0,0,.15)}
.bubble:after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fff}
.badge{position:absolute;left:0;top:0;padding:3px 8px;border-radius:8px;background:var(--hp);color:#fff;font:15px/1 var(--display);letter-spacing:.08em}
@media (prefers-reduced-motion:reduce){.chip.bump{animation:none}#banner{transition:none}}
</style>

<div id="game"></div>
<div id="ov"></div>
<div id="joy"><i></i></div>

<div id="brand" class="hud">
  <div id="logo">FROSTHOLD<small>OUTPOST</small></div>
  <div id="quest"><b>Goal</b><span id="questTxt">Chop trees to gather logs</span></div>
  <div id="defense" hidden>
    <div class="row"><span>Palisade</span><span id="wallTxt">100</span></div>
    <div class="bar"><i id="wallBar"></i></div>
    <div class="row"><span>Wolf raid</span><span id="waveTxt">1:00</span></div>
  </div>
</div>

<div id="res" class="hud">
  <div class="chip" id="cCash"><svg class="ico" viewBox="0 0 28 22"><rect x="2" y="4" width="24" height="14" rx="2" fill="#43b96a" stroke="#1f6b3a" stroke-width="2"/><circle cx="14" cy="11" r="4" fill="#bff0cd"/></svg><span id="vCash">0</span></div>
  <div class="chip" id="cLog"><svg class="ico" viewBox="0 0 28 22"><rect x="3" y="5" width="18" height="12" rx="3" fill="#a8693f" stroke="#5b3416" stroke-width="2"/><ellipse cx="21" cy="11" rx="5" ry="6" fill="#e8c28f" stroke="#5b3416" stroke-width="2"/><circle cx="21" cy="11" r="2" fill="none" stroke="#a8693f" stroke-width="1.5"/></svg><span id="vLog">0</span></div>
  <div class="chip" id="cMeat"><svg class="ico" viewBox="0 0 28 22"><ellipse cx="13" cy="11" rx="10" ry="7" fill="#d9524b" stroke="#7a1f1a" stroke-width="2"/><ellipse cx="11" cy="10" rx="4" ry="2.5" fill="#f6c3b6"/><rect x="21" y="9" width="6" height="4" rx="2" fill="#f4ede0" stroke="#7a1f1a" stroke-width="1.5"/></svg><span id="vMeat">0</span></div>
  <div class="chip" id="cOre"><svg class="ico" viewBox="0 0 28 22"><path d="M4 16 L9 6 L22 6 L25 16 Z" fill="#f2c14e" stroke="#8a6410" stroke-width="2" stroke-linejoin="round"/><path d="M10 8 L15 8 L13 12 Z" fill="#fff3c4"/></svg><span id="vOre">0</span></div>
</div>

<div id="banner" class="hud"></div>
<div id="hint" class="hud">Drag anywhere to move</div>
<button id="mute" class="hud" type="button" aria-label="Toggle sound">♪</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
/* ================= utils ================= */
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const d2 = (ax, az, bx, bz) => (ax - bx) * (ax - bx) + (az - bz) * (az - bz);
const $ = id => document.getElementById(id);

/* ================= renderer / scene ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
$('game').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9eff8);

const CAM_OFF = new THREE.Vector3(9, 24, 17);
const camera = new THREE.OrthographicCamera(-10, 10, 10, -10, 0.1, 200);
const camTarget = new THREE.Vector3(0, 0, 3);
const PAD_ROT = Math.atan2(CAM_OFF.x, CAM_OFF.z);
const FWD = new THREE.Vector2(-CAM_OFF.x, -CAM_OFF.z).normalize();   // screen-up on ground
const RIGHT = new THREE.Vector2(-FWD.y, FWD.x);                       // screen-right on ground

function resize() {
  const w = window.innerWidth, h = window.innerHeight, a = w / h;
  let halfH = Math.max(8.5, 6.4 / a), halfW = halfH * a;
  camera.left = -halfW; camera.right = halfW; camera.top = halfH; camera.bottom = -halfH;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', resize); resize();

scene.add(new THREE.HemisphereLight(0xffffff, 0xaab8d4, 0.72));
const sun = new THREE.DirectionalLight(0xfff1de, 0.62);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -22, right: 22, top: 22, bottom: -22, near: 1, far: 80 });
sun.shadow.bias = -0.0015;
scene.add(sun, sun.target);
const SUN_OFF = new THREE.Vector3(-12, 26, 10);

/* ================= materials / geometry ================= */
const mats = {};
function mat(c, extra) {
  const k = c + (extra ? JSON.stringify(extra) : '');
  return mats[k] || (mats[k] = new THREE.MeshPhongMaterial(Object.assign({ color: c, flatShading: true, shininess: 0, specular: 0 }, extra || {})));
}
function mk(geo, c, cast = true, recv = false, extra) {
  const m = new THREE.Mesh(geo, mat(c, extra)); m.castShadow = cast; m.receiveShadow = recv; return m;
}
const Box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const Cyl = (a, b, h, s = 8) => new THREE.CylinderGeometry(a, b, h, s);
const Cone = (r, h, s = 8) => new THREE.ConeGeometry(r, h, s);

const COLOR = { cash: 0x43b96a, log: 0xa8693f, meat: 0xd9524b, ore: 0xf2c14e };
const ITEM_H = { cash: 0.085, log: 0.24, meat: 0.14, ore: 0.2 };
const GEO = {
  cash: Box(0.5, 0.075, 0.28),
  log: (() => { const g = Cyl(0.12, 0.12, 0.52, 7); g.rotateZ(Math.PI / 2); return g; })(),
  meat: Cyl(0.21, 0.19, 0.12, 9),
  ore: (() => { const g = Box(0.42, 0.18, 0.26); return g; })(),
};
function itemMesh(t) { const m = new THREE.Mesh(GEO[t], mat(COLOR[t])); m.castShadow = true; return m; }

/* ================= world ================= */
const WALL_Z = 0, GATE = 2.3, MINE_Z = -42;
const BOUNDS = { x0: -33, x1: 33, z0: -58, z1: 26 };

const ground = mk(new THREE.PlaneGeometry(220, 220), 0xf4f7fc, false, true);
ground.rotation.x = -Math.PI / 2; scene.add(ground);
function flat(w, d, c, x, z, y = 0.012) {
  const m = mk(new THREE.PlaneGeometry(w, d), c, false, true); m.rotation.x = -Math.PI / 2; m.position.set(x, y, z); scene.add(m); return m;
}
flat(70, 5.4, 0xdcc6a2, 0, 3.5);              // packed road along the palisade
flat(5, 9, 0xe2e7f0, 0, -4.4, 0.01);          // trampled trail north of gate
flat(7, 8, 0xe7dccb, 0, 10.5, 0.011);         // market square
const lake = mk(new THREE.CircleGeometry(8, 9), 0xc6dcef, false, true);
lake.rotation.x = -Math.PI / 2; lake.position.set(-17, 0.015, 21); scene.add(lake);
const lake2 = mk(new THREE.CircleGeometry(5.5, 8), 0xd3e5f4, false, true);
lake2.rotation.x = -Math.PI / 2; lake2.position.set(-17.5, 0.02, 21.5); scene.add(lake2);
flat(9, 5, 0xe0e6ef, 0, -45, 0.011);          // mine trail

const obstacles = [];  // {x,z,r,on:()=>bool}
function addObs(x, z, r, on) { const o = { x, z, r, on: on || (() => true) }; obstacles.push(o); return o; }

/* ---- palisade (instanced) ---- */
const wallGroup = new THREE.Group(); scene.add(wallGroup);
const wallXs = [];
for (let x = -34; x <= 34.01; x += 0.5) if (Math.abs(x) > GATE + 0.45) wallXs.push(x);
const postGeo = Cyl(0.23, 0.25, 2.0, 7), capGeo = Cone(0.25, 0.55, 7);
const wallMatWood = mat(0x9a5e38), wallMatStone = mat(0x8f99a6);
const posts = new THREE.InstancedMesh(postGeo, wallMatWood, wallXs.length);
const caps = new THREE.InstancedMesh(capGeo, mat(0xffffff), wallXs.length);
posts.castShadow = caps.castShadow = true;
const tmpM = new THREE.Matrix4();
wallXs.forEach((x, i) => {
  const h = 1 + Math.sin(x * 3.1) * 0.06;
  tmpM.makeScale(1, h, 1).setPosition(x, h, WALL_Z); posts.setMatrixAt(i, tmpM);
  tmpM.makeScale(1, 1, 1).setPosition(x, 2 * h + 0.27, WALL_Z); caps.setMatrixAt(i, tmpM);
});
wallGroup.add(posts, caps);
// gate arch
[-1, 1].forEach(s => {
  const p = mk(Box(0.6, 3.2, 0.6), 0x7a4527); p.position.set(s * (GATE + 0.3), 1.6, WALL_Z); wallGroup.add(p);
  const c = mk(Box(0.75, 0.2, 0.75), 0xffffff); c.position.set(s * (GATE + 0.3), 3.3, WALL_Z); wallGroup.add(c);
});
const beam = mk(Box(GATE * 2 + 1.4, 0.35, 0.4), 0x7a4527); beam.position.set(0, 3.0, WALL_Z); wallGroup.add(beam);

/* ---- mine fence ---- */
const mineGate = new THREE.Group(); scene.add(mineGate);
for (let x = -34; x <= 34.01; x += 0.7) {
  const p = mk(Cyl(0.13, 0.15, 1.3, 6), 0x7d5236); p.position.set(x, 0.65, MINE_Z);
  (Math.abs(x) < 2.6 ? mineGate : scene).add(p);
}
[0.45, 0.95].forEach(y => {
  [-1, 1].forEach(s => { const r = mk(Box(31.4, 0.1, 0.1), 0x8d6142, false); r.position.set(s * 18.7, y, MINE_Z); scene.add(r); });
  const r = mk(Box(5.2, 0.12, 0.12), 0xc0392b, false); r.position.set(0, y, MINE_Z); mineGate.add(r);
});

/* ---- trees ---- */
const TREE_GREENS = [0x2f7a69, 0x3b8c76, 0x2a6c66];
function makeTreeModel(s = 1) {
  const g = new THREE.Group();
  const top = new THREE.Group(); g.add(top);
  const trunk = mk(Cyl(0.18, 0.24, 0.9, 6), 0x7b4a2b); trunk.position.y = 0.45; top.add(trunk);
  const col = TREE_GREENS[(Math.random() * 3) | 0];
  [[1.25, 1.5, 1.35], [1.0, 1.3, 2.05], [0.7, 1.1, 2.7]].forEach(([r, h, y]) => {
    const c = mk(Cone(r, h, 7), col); c.position.y = y; c.rotation.y = Math.random(); top.add(c);
  });
  const snow = mk(Cone(0.42, 0.55, 7), 0xffffff); snow.position.y = 3.15; top.add(snow);
  const snow2 = mk(Cyl(0.9, 1.05, 0.12, 7), 0xf7fbff); snow2.position.y = 1.62; top.add(snow2);
  g.scale.setScalar(s);
  return { g, top };
}
const stumpGeo = Cyl(0.24, 0.28, 0.3, 7);
const trees = [];
function placeTrees(n, x0, x1, z0, z1, spacing, choppable) {
  let tries = 0, placed = 0;
  while (placed < n && tries++ < n * 40) {
    const x = rand(x0, x1), z = rand(z0, z1);
    if (Math.abs(x) < 3.2 && z > -9 && z < 0) continue;           // keep gate trail clear
    if (trees.some(t => d2(t.x, t.z, x, z) < spacing * spacing)) continue;
    const s = choppable ? rand(0.85, 1.05) : rand(1.0, 1.35);
    const { g, top } = makeTreeModel(s);
    g.position.set(x, 0, z); scene.add(g);
    const stump = mk(stumpGeo, 0x8a5634); stump.position.y = 0.15; stump.visible = false; g.add(stump);
    const t = { x, z, g, top, stump, hp: 4, max: 4, alive: true, respawn: 0, shake: 0, grow: 1, choppable, kind: 'tree' };
    t.obs = addObs(x, z, 0.55 * s, () => t.alive);
    trees.push(t); placed++;
  }
}
placeTrees(46, -31, -5, -38, -5, 2.0, true);
placeTrees(12, -6, 6, -38, -16, 2.2, true);
// decorative border forest (not choppable)
for (let x = -40; x <= 40; x += 2.6) { placeTrees(1, x - 1, x + 1, -64, -60, 1.5, false); }
for (let z = -60; z <= 28; z += 2.6) { placeTrees(1, -40, -36, z - 1, z + 1, 1.5, false); placeTrees(1, 36, 40, z - 1, z + 1, 1.5, false); }
placeTrees(8, 22, 34, 14, 26, 2.4, false);
placeTrees(6, -34, -28, 4, 14, 2.4, false);

/* ---- decor ---- */
function crate(x, z, s = 1, r = 0) { const c = mk(Box(0.9 * s, 0.9 * s, 0.9 * s), 0xb57f4b); c.position.set(x, 0.45 * s, z); c.rotation.y = r; scene.add(c);
  const b = mk(Box(0.95 * s, 0.12 * s, 0.95 * s), 0x8a5a33); b.position.set(x, 0.45 * s, z); b.rotation.y = r; scene.add(b); }
crate(-24, 3.5); crate(-23.1, 3.9, 0.8, 0.4); crate(-23.6, 3.6, 0.7, 0.2); crate(-23.6, 4.3, 0.75, 0.2);
crate(25, 3.4, 1, 0.3); crate(26, 3.8, 0.8);
function boulder(x, z, s) { const b = mk(new THREE.DodecahedronGeometry(1, 0), 0xa3adbb); b.position.set(x, 0.55 * s, z); b.scale.set(s, s * 0.75, s); b.rotation.y = rand(0, 3); scene.add(b); addObs(x, z, 0.95 * s); }
boulder(-27, 7, 1.4); boulder(28, 12, 1.2); boulder(14, 20, 1);
// campfire in the square
const fire = new THREE.Group(); fire.position.set(0, 0, 15.5); scene.add(fire);
for (let i = 0; i < 6; i++) { const s = mk(new THREE.DodecahedronGeometry(0.25, 0), 0x8d96a3); s.position.set(Math.cos(i / 6 * TAU) * 0.65, 0.12, Math.sin(i / 6 * TAU) * 0.65); fire.add(s); }
const flameMat = new THREE.MeshBasicMaterial({ color: 0xff9a3c });
const flame = new THREE.Mesh(Cone(0.38, 0.9, 6), flameMat); flame.position.y = 0.5; fire.add(flame);
const flame2 = new THREE.Mesh(Cone(0.22, 0.6, 6), new THREE.MeshBasicMaterial({ color: 0xffe08a })); flame2.position.y = 0.42; fire.add(flame2);
addObs(0, 15.5, 0.9);

/* ================= characters ================= */
function makePerson(coat, trim, hat) {
  const g = new THREE.Group();
  const body = mk(Cyl(0.3, 0.4, 0.78, 8), coat); body.position.y = 0.78; g.add(body);
  const belt = mk(Cyl(0.36, 0.38, 0.1, 8), 0x4a3424); belt.position.y = 0.62; g.add(belt);
  const head = mk(new THREE.SphereGeometry(0.25, 8, 6), 0xf0c39b); head.position.y = 1.36; g.add(head);
  const hood = mk(new THREE.SphereGeometry(0.3, 8, 6, 0, TAU, 0, Math.PI * 0.55), hat || coat); hood.position.y = 1.4; g.add(hood);
  const fur = mk(new THREE.TorusGeometry(0.24, 0.07, 5, 10), trim); fur.position.set(0, 1.35, 0.08); g.add(fur);
  const legs = [-1, 1].map(s => { const l = mk(Box(0.17, 0.42, 0.2), 0x3e3a46); l.geometry.translate(0, -0.21, 0); l.position.set(s * 0.14, 0.44, 0); g.add(l);
    const b = mk(Box(0.2, 0.12, 0.28), 0x5a3a24); b.position.set(0, -0.38, 0.03); l.add(b); return l; });
  const arms = [-1, 1].map(s => { const a = mk(Box(0.15, 0.48, 0.17), coat); a.geometry.translate(0, -0.2, 0); a.position.set(s * 0.4, 1.06, 0); g.add(a); return a; });
  return { g, legs, arms };
}
function animWalk(p, t, moving) {
  const a = moving ? Math.sin(t * 12) * 0.6 : 0;
  p.legs[0].rotation.x = a; p.legs[1].rotation.x = -a;
  p.arms[0].rotation.x = -a * 0.6; p.arms[1].rotation.x = a * 0.6;
}

/* ---- player ---- */
const P = makePerson(0xc8452f, 0xf3e6cf, 0x2f4a6d);
const player = { x: 0, z: 4.2, rot: Math.PI, moving: false, atkT: 0, swingT: 0, walkT: 0, ...P };
scene.add(player.g);
const ring = new THREE.Mesh(new THREE.RingGeometry(0.62, 0.74, 28), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 }));
ring.rotation.x = -Math.PI / 2; ring.position.y = 0.03; player.g.add(ring);
const pack = mk(Box(0.55, 0.55, 0.28), 0x6f4a2d); pack.position.set(0, 0.95, -0.36); player.g.add(pack);

function barrier(oz, nx, nz, lineZ, gate, r) {
  if (Math.abs(nz - lineZ) < r && Math.abs(nx) > gate) return oz < lineZ ? lineZ - r : lineZ + r;
  return nz;
}
function collide(e, nx, nz, r) {
  nz = clamp(nz, S.mine ? BOUNDS.z0 : MINE_Z + 0.6, BOUNDS.z1); nx = clamp(nx, BOUNDS.x0, BOUNDS.x1);
  if (!S.wallBroken) nz = barrier(e.z, nx, nz, WALL_Z, GATE - r + 0.3, r + 0.25);
  if (S.mine) nz = barrier(e.z, nx, nz, MINE_Z, 2.4 - r + 0.3, r + 0.2);
  for (const o of obstacles) {
    if (!o.on()) continue;
    const dx = nx - o.x, dz = nz - o.z, rr = o.r + r, dd = dx * dx + dz * dz;
    if (dd < rr * rr && dd > 1e-6) { const d = Math.sqrt(dd); nx = o.x + dx / d * rr; nz = o.z + dz / d * rr; }
  }
  e.x = nx; e.z = nz;
}
function turnTo(cur, target, k) { let d = target - cur; d = Math.atan2(Math.sin(d), Math.cos(d)); return cur + d * k; }
function waypoint(x, z, tx, tz) {
  if ((z < WALL_Z) !== (tz < WALL_Z) && !S.wallBroken) {
    if (Math.abs(x) > 0.9) return [0, z < WALL_Z ? -2 : 2];
    return [0, z < WALL_Z ? 2.2 : -2.2];
  }

}
function walkTo(e, tx, tz, speed, dt) {
  const [wx, wz] = waypoint(e.x, e.z, tx, tz);
  const dx = wx - e.x, dz = wz - e.z, L = Math.hypot(dx, dz);
  if (L < 0.05) return true;
  const st = Math.min(L, speed * dt);
  e.x += dx / L * st; e.z += dz / L * st;
  e.rot = turnTo(e.rot || 0, Math.atan2(dx, dz), 0.2);
  return wx === tx && wz === tz && L < 0.25;
}

function playerAttack() {
  const A = AXE[S.axe], R2 = A.range * A.range;
  const cands = [];
  for (const w of wolves) if (w.alive && d2(w.x, w.z, player.x, player.z) < R2 * 1.1) cands.push([0, w]);
  for (const y of yaks) if (y.alive && d2(y.x, y.z, player.x, player.z) < R2 * 1.1) cands.push([1, y]);
  for (const t of trees) if (t.alive && t.choppable && d2(t.x, t.z, player.x, player.z) < R2) cands.push([2, t]);
  if (S.mine) for (const r of rocks) if (r.alive && d2(r.x, r.z, player.x, player.z) < R2 * 1.15) cands.push([3, r]);
  if (!cands.length) return false;
  cands.sort((a, b) => a[0] - b[0] || d2(a[1].x, a[1].z, player.x, player.z) - d2(b[1].x, b[1].z, player.x, player.z));

/* ================= main loop ================= */
let last = performance.now(), time = 0;
const vals = { cash: $('vCash'), log: $('vLog'), meat: $('vMeat'), ore: $('vOre') };
const shown = { cash: -1, log: -1, meat: -1, ore: -1 };

function update(dt) {
  time += dt;
  readInput();

  /* --- player move --- */
  const mx = RIGHT.x * input.x - FWD.x * input.y, mz = RIGHT.y * input.x - FWD.y * input.y;
  const mag = Math.hypot(mx, mz);
  player.moving = mag > 0.05;
  if (player.moving) {
    const sp = 5.6 * Math.min(1, mag);
    collide(player, player.x + mx / mag * sp * dt * Math.min(1, mag), player.z + mz / mag * sp * dt * Math.min(1, mag), 0.45);
    if (player.swingT <= 0) player.rot = turnTo(player.rot, Math.atan2(mx, mz), 0.25);
    player.walkT += dt;
  } else collide(player, player.x, player.z, 0.45);
  player.g.position.set(player.x, 0, player.z);
  player.g.rotation.y = player.rot;
  animWalk(player, player.walkT, player.moving);
  ring.rotation.z += dt;

  /* --- attack --- */
  player.atkT -= dt;
  if (player.atkT <= 0 && playerAttack()) { player.atkT = AXE[S.axe].int; player.swingT = 0.3; }
  if (player.swingT > 0) {
    player.swingT -= dt; const k = 1 - player.swingT / 0.3;
    axePivot.rotation.y = -k * TAU; trail.material.opacity = Math.sin(k * Math.PI) * 0.55;
    axe1.rotation.z = 0; axe1.position.set(0.85, 0, 0);
    axe2.position.set(-0.85, 0, 0);
  } else {
    axePivot.rotation.y = 0; trail.material.opacity = 0;
    axe1.position.set(0.5, -0.15, 0.15); axe1.rotation.z = -1.1; axe2.position.set(-0.5, -0.15, 0.15);
  }

  /* --- trees / rocks respawn & shake --- */
  for (const t of trees) {
    if (!t.alive) { t.respawn -= dt; if (t.respawn <= 0 && d2(t.x, t.z, player.x, player.z) > 2.5) { t.alive = true; t.hp = t.max; t.top.visible = true; t.stump.visible = false; t.grow = 0; } }
    if (t.grow < 1) { t.grow = Math.min(1, t.grow + dt * 2); t.top.scale.setScalar(t.grow); }
    if (t.shake > 0) { t.shake -= dt; t.top.rotation.z = Math.sin(t.shake * 40) * t.shake * 0.4; } else t.top.rotation.z = 0;
  }
  for (const r of rocks) {
    if (!r.alive) { r.respawn -= dt; if (r.respawn <= 0) { r.alive = true; r.hp = r.max; r.g.visible = true; } }
    if (r.shake > 0) { r.shake -= dt; r.g.position.x = r.x + Math.sin(r.shake * 50) * 0.06; } else r.g.position.x = r.x;
  }

  /* --- yaks --- */
  for (const y of yaks) {
    if (!y.alive) continue;
    let sp = 0;
    if (y.flee > 0) { y.flee -= dt; sp = 3.2; }
    else if (y.idle > 0) { y.idle -= dt; }
    else { sp = 1.1; if (d2(y.x, y.z, y.tx, y.tz) < 0.3) { y.idle = rand(1, 4); y.tx = rand(YAK_ZONE.x0, YAK_ZONE.x1); y.tz = rand(YAK_ZONE.z0, YAK_ZONE.z1); } }
    if (sp > 0) {
      const dx = y.tx - y.x, dz = y.tz - y.z, L = Math.hypot(dx, dz);
      if (L > 0.1) { y.x += dx / L * sp * dt; y.z += dz / L * sp * dt; y.rot = turnTo(y.rot, Math.atan2(dx, dz), 0.12); y.walkT += dt * sp; }
      y.z = Math.min(y.z, -1.5);
    }
    const s = y.shake > 0 ? 1 + Math.sin((y.shake -= dt) * 40) * 0.08 : 1;
    y.g.position.set(y.x, 0, y.z); y.g.rotation.y = y.rot; y.g.scale.setScalar(s);
    const a = Math.sin(y.walkT * 6) * 0.5; y.legs[0].rotation.x = y.legs[3].rotation.x = a; y.legs[1].rotation.x = y.legs[2].rotation.x = -a;
    if (y.hp < y.max) setBar(y.bar, y.hp / y.max, y.x, 2.2, y.z); else y.bar.hidden = true;
  }

  /* --- drops (magnet pickup) --- */
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i]; d.t += dt;
    d.m.position.x += (d.x - d.m.position.x) * Math.min(1, dt * 6); d.m.position.z += (d.z - d.m.position.z) * Math.min(1, dt * 6);
    d.m.position.y = 0.25 + Math.abs(Math.sin(d.t * 3)) * 0.25; d.m.rotation.y += dt * 2;
    if (d.t > 0.4 && d2(d.x, d.z, player.x, player.z) < 8) {
      if (d.type === 'cash') { giveCash(d.value, d.m.position, 3); floatText('+$' + d.value, d.x, 2, d.z, 'cash'); }
      else if (room() > 0) giveItem(d.type, d.m.position);
      else { notifyFull(); continue; }
      scene.remove(d.m); drops.splice(i, 1);
    } else if (d.t > 60) { scene.remove(d.m); drops.splice(i, 1); }
  }

  /* --- stalls --- */
  for (const s of stalls) {
    if (!s.unlocked) continue;
    if (s.flameM) { s.flameM.scale.y = 1 + Math.sin(time * 14) * 0.15; }
    // deposit
    s.dropT -= dt;
    if (s.dropT < -0.2) s.dropT = 0;
    for (let n = 0; n < 3 && carry[s.type].length && d2(player.x, player.z, s.drop.x, s.drop.z) < 2.1 && s.dropT <= 0 && s.stock + s.incoming < 64; n++) {
      s.dropT += 0.075;
      const wp = takeFromStack(s.type); const m = itemMesh(s.type); m.position.copy(wp); scene.add(m);
      const idx = s.stock + s.incoming; s.incoming++;
      fly(m, counterSlot(s, idx), 0.28, 1.2, () => { scene.remove(m); s.incoming--; s.stock++; s.received++; const cm = itemMesh(s.type); cm.position.copy(counterSlot(s, s.counter.length)); if (s.counter.length < 32) { scene.add(cm); } s.counter.push(cm); });
      sfx(420, 0.04);
    }
    // queue movement
    s.queue.forEach((v, i) => {
      const sp = slotPos(s, i);
      const dx = sp.x - v.x, dz = sp.z - v.z, L = Math.hypot(dx, dz);
      v.moving = L > 0.08;
      if (v.moving) { const st = Math.min(L, 2.6 * dt); v.x += dx / L * st; v.z += dz / L * st; v.walkT += dt; v.g.rotation.y = Math.atan2(dx, dz); }
      else v.g.rotation.y = turnTo(v.g.rotation.y, Math.PI, 0.2);
      v.g.position.set(v.x, 0, v.z); animWalk(v, v.walkT, v.moving);
    });
    // serve front
    const f = s.queue[0];
    if (f && !f.moving && d2(f.x, f.z, slotPos(s, 0).x, slotPos(s, 0).z) < 0.05) {
      const need = f.want - f.got - f.pend;
      s.serveT -= dt;
      if (need > 0 && s.stock > 0 && s.serveT <= 0) {
        s.serveT = 0.2; s.stock--;
        const cm = s.counter.pop(); const m = itemMesh(s.type);
        if (cm) { m.position.copy(cm.position); scene.remove(cm); } else m.position.copy(counterSlot(s, 0));
        if (s.counter.length >= 32) { const re = s.counter[31]; if (re && !re.parent) scene.add(re); }
        scene.add(m); f.pend++;
        fly(m, () => new THREE.Vector3(f.x, 1.3 + f.items.length * ITEM_H[s.type], f.z - 0.35), 0.25, 0.8, () => {
          scene.remove(m); f.pend--; f.got++;
          const im = itemMesh(s.type); im.position.set(0, 1.25 + f.items.length * ITEM_H[s.type], -0.35); f.g.add(im); f.items.push(im);
        });
      }
      if (f.got >= f.want && f.pend === 0) {
        const amt = f.want * s.price;
        const from = new THREE.Vector3(f.x, 1.5, f.z);
        const k = Math.min(6, Math.ceil(amt / 2)); let left = amt;
        for (let i = 0; i < k; i++) {
          const share = i === k - 1 ? left : Math.floor(amt / k); left -= share;
          const m = itemMesh('cash'); m.position.copy(from); scene.add(m);
          setTimeout(() => fly(m, new THREE.Vector3(s.palletPos.x + rand(-0.5, 0.5), 0.6 + s.pallet * 0.004, s.palletPos.z + rand(-0.5, 0.5)), 0.4, 1.2, () => { scene.remove(m); s.pallet += share; syncPallet(s); }), i * 60);
        }
        floatText('+$' + amt, f.x, 2.4, f.z, 'cash'); sfx(990, 0.08, 'sine', 0.04);
        s.sold++; s.queue.shift(); f.state = 'leave'; f.leaveTo = { x: s.x - 6, z: s.z + 14 }; leaving.push(f);
        spawnVillager(s, 0);
      }
      // bubble
      const rem = f.want - f.got;
      if (rem > 0) { s.bubble.hidden = false; const html = s.bubbleIcon + '<span>' + rem + '</span>'; if (s.bubble._h !== html) { s.bubble.innerHTML = html; s.bubble._h = html; } place(s.bubble, f.x, 2.55, f.z); }
      else s.bubble.hidden = true;
    } else s.bubble.hidden = true;
    // collect pallet
    s.palT -= dt; if (s.palT < -0.2) s.palT = 0;
    for (let n = 0; n < 4 && s.pallet > 0 && d2(player.x, player.z, s.palletPos.x, s.palletPos.z) < 2.6 && s.palT <= 0; n++) {
      s.palT += 0.035;
      const chunk = Math.max(1, Math.ceil(s.pallet / 30)); s.pallet -= chunk; syncPallet(s);
      const m = itemMesh('cash'); m.position.set(s.palletPos.x + rand(-0.5, 0.5), 0.5, s.palletPos.z + rand(-0.5, 0.5)); scene.add(m);
      fly(m, () => stackWorld('cash'), 0.3, 1.0, () => { scene.remove(m); S.wallet += chunk; bump('cash'); sfx(880 + Math.random() * 80, 0.04, 'sine', 0.035); });
    }
  }
  for (let i = leaving.length - 1; i >= 0; i--) {
    const v = leaving[i]; const dx = v.leaveTo.x - v.x, dz = v.leaveTo.z - v.z, L = Math.hypot(dx, dz);
    if (L < 0.3) { scene.remove(v.g); leaving.splice(i, 1); continue; }
    v.x += dx / L * 2.6 * dt; v.z += dz / L * 2.6 * dt; v.walkT += dt; v.g.rotation.y = Math.atan2(dx, dz);
    v.g.position.set(v.x, 0, v.z); animWalk(v, v.walkT, true);
  }

  /* --- pads --- */
  for (const p of pads) {
    const was = p.active;
    p.active = !p.done && p.requires();
    if (p.active !== was) { p.g.visible = p.active; if (p.active && !p.repeat && time > 1) { burst(p.x, 0.5, p.z, 0xff8a3d, 8, 2); } }
    if (!p.active) continue;
    p.g.position.y = 0.04 + (d2(player.x, player.z, p.x, p.z) < 1.6 ? 0.02 : 0);
    const onPad = d2(player.x, player.z, p.x, p.z) < 1.5;
    if (!onPad) { p.payT = 0.25; continue; }
    p.payT -= dt;
    for (let n = 0; n < 4 && S.wallet > 0 && p.remaining > 0 && p.payT <= 0 && !p.done; n++) {
      p.payT += 0.04;
      const cost = p.costs[p.level];
      const chunk = Math.min(Math.max(1, Math.round(cost / 28)), p.remaining, S.wallet);
      S.wallet -= chunk; p.remaining -= chunk; drawPad(p);
      const m = itemMesh('cash'); m.position.copy(stackWorld('cash')); scene.add(m);
      fly(m, new THREE.Vector3(p.x, 0.1, p.z), 0.25, 1.0, () => scene.remove(m));
      sfx(600 + (1 - p.remaining / cost) * 500, 0.04, 'square', 0.025);
      if (p.remaining <= 0) {
        p.level++;
        p.onBuy(p.level);
        burst(p.x, 0.6, p.z, 0xffd166, 14, 3); sfx(1200, 0.2, 'sine', 0.06);
        if (p.repeat) { p.level = 0; p.remaining = p.costs[0]; }
        else if (p.level < p.costs.length) p.remaining = p.costs[p.level];
        else { p.done = true; p.g.visible = false; }
        drawPad(p);
        p.payT = 0.6;
        break;
      }
    }
  }

  /* --- towers --- */
  for (const t of towers) {
    if (t.grow < 1) { t.grow = Math.min(1, t.grow + dt * 2.5); t.g.scale.setScalar(0.01 + t.grow * 0.99); }
    t.cd -= dt;
    let best = null, bd = 18 * 18;
    for (const w of wolves) if (w.alive) { const d = d2(w.x, w.z, t.x, t.z); if (d < bd) { bd = d; best = w; } }
    if (best) {
      t.archer.g.rotation.y = Math.atan2(best.x - t.x, best.z - t.z);
      if (t.cd <= 0) {
        t.cd = 0.75;
        const a = new THREE.Mesh(arrowGeo, mat(0x4a3424)); a.position.set(t.x, 4, t.z); scene.add(a);
        arrows.push({ m: a, w: best, t: 0 });
        sfx(1400, 0.03, 'triangle', 0.02);
      }
    }
  }
  for (let i = arrows.length - 1; i >= 0; i--) {
    const a = arrows[i]; a.t += dt;
    const tx = a.w.x, ty = 0.9, tz = a.w.z;
    const dx = tx - a.m.position.x, dy = ty - a.m.position.y, dz = tz - a.m.position.z, L = Math.hypot(dx, dy, dz);
    if (L < 0.4 || !a.w.alive || a.t > 2) { if (a.w.alive && L < 0.4) damageWolf(a.w, 2); scene.remove(a.m); arrows.splice(i, 1); continue; }
    const st = Math.min(L, 22 * dt); a.m.position.x += dx / L * st; a.m.position.y += dy / L * st; a.m.position.z += dz / L * st;
    a.m.lookAt(tx, ty, tz);
  }

  /* --- helper --- */
  if (helper) {
    const h = helper; let moving = false;
    if (h.state === 'seek') {
      if (!h.tree || !h.tree.alive) { let b = null, bd = 1e9; for (const t of trees) if (t.alive && t.choppable && t.z < -6) { const d = d2(t.x, t.z, h.x, h.z) + d2(t.x, t.z, player.x, player.z) * 0.15; if (d < bd) { bd = d; b = t; } } h.tree = b; }
      if (h.tree) {
        const a = Math.atan2(h.x - h.tree.x, h.z - h.tree.z);
        const gx = h.tree.x + Math.sin(a) * 1.1, gz = h.tree.z + Math.cos(a) * 1.1;
        if (d2(h.x, h.z, h.tree.x, h.tree.z) > 1.6 * 1.6) { walkTo(h, gx, gz, 3.4, dt); moving = true; }
        else {
          h.rot = turnTo(h.rot, Math.atan2(h.tree.x - h.x, h.tree.z - h.z), 0.3);
          h.t -= dt; h.axe.rotation.x = Math.max(0, h.t) * 4;
          if (h.t <= 0) {
            h.t = 0.85; const n = hitTree(h.tree, 1);
            for (let i = 0; i < n && h.logs.length < 8; i++) { const l = itemMesh('log'); l.position.set(0, h.logs.length * ITEM_H.log, 0); h.sg.add(l); h.logs.push(l); }
            if (h.logs.length >= 8) h.state = 'deliver';
          }
        }
      }
    } else {
      const s = woodStall;
      if (d2(h.x, h.z, s.drop.x, s.drop.z - 0.4) > 0.6) { walkTo(h, s.drop.x - 0.6, s.drop.z - 0.4, 3.4, dt); moving = true; }
      else {
        h.t -= dt;
        if (h.t <= 0 && h.logs.length) {
          h.t = 0.12; const l = h.logs.pop(); const wp = new THREE.Vector3(); l.getWorldPosition(wp); h.sg.remove(l);
          const m = itemMesh('log'); m.position.copy(wp); scene.add(m); const idx = s.stock + s.incoming; s.incoming++;
          fly(m, counterSlot(s, idx), 0.28, 1, () => { scene.remove(m); s.incoming--; s.stock++; s.received++; const cm = itemMesh('log'); cm.position.copy(counterSlot(s, s.counter.length)); if (s.counter.length < 32) scene.add(cm); s.counter.push(cm); });
        }
        if (!h.logs.length) h.state = 'seek';
      }
    }
    if (moving) h.walkT += dt;
    h.g.position.set(h.x, 0, h.z); h.g.rotation.y = h.rot || 0; animWalk(h, h.walkT, moving);
  }

  /* --- waves --- */
  const defenseOn = S.step >= 6;
  if (defenseOn) {
    $('defense').hidden = false;
    if (!S.raidOn) {
      S.waveT -= dt;
      if (S.waveT <= 0) { S.raidOn = true; S.wave++; const n = 2 + S.wave; for (let i = 0; i < n; i++) spawnWolf(Math.floor(S.wave / 2)); banner('Wolf raid! ' + n + ' wolves'); sfx(110, 0.5, 'sawtooth', 0.05); }
    } else if (!wolves.some(w => w.alive)) { S.raidOn = false; S.waveT = Math.max(40, 62 - S.wave * 2); banner('Raid repelled', true); }
  }
  for (let i = wolves.length - 1; i >= 0; i--) {
    const w = wolves[i];
    if (!w.alive) { wolves.splice(i, 1); continue; }
    let moving = false;
    if (S.wallBroken && (w.state === 'approach' || w.state === 'attack')) w.state = 'raid';
    if (w.state === 'approach') {
      const dx = w.tx - w.x, dz = -0.95 - w.z, L = Math.hypot(dx, dz);
      if (L < 0.2) w.state = 'attack'; else { w.x += dx / L * 2.4 * dt; w.z += dz / L * 2.4 * dt; w.rot = turnTo(w.rot, Math.atan2(dx, dz), 0.2); moving = true; }
    } else if (w.state === 'attack') {
      w.rot = turnTo(w.rot, 0, 0.2);
      w.atkT -= dt;
      if (w.atkT <= 0) {
        w.atkT = 1; S.wallHP = Math.max(0, S.wallHP - 3); w.shake = 0.15; burst(w.x, 1, 0, S.wallLv > 1 ? 0x8f99a6 : 0x9a5e38, 2, 2);
        if (S.wallHP <= 0 && !S.wallBroken) { S.wallBroken = true; wallGroup.scale.y = 0.3; banner('The palisade broke!'); sfx(90, 0.6, 'sawtooth', 0.06); }
      }
    } else if (w.state === 'raid') {
      let tgt = null; for (const s of stalls) if (s.unlocked && s.pallet > 0 && (!tgt || s.pallet > tgt.pallet)) tgt = s;
      const tx = tgt ? tgt.palletPos.x : 0, tz = tgt ? tgt.palletPos.z : 12;
      const dx = tx - w.x, dz = tz - w.z, L = Math.hypot(dx, dz);
      if (L < 1.2) {
        if (tgt) { const take = Math.min(tgt.pallet, 12); tgt.pallet -= take; w.loot += take; syncPallet(tgt); if (take) floatText('-$' + take, tx, 2, tz, 'bad'); }
        w.state = 'flee';
      } else { w.x += dx / L * 2.8 * dt; w.z += dz / L * 2.8 * dt; w.rot = turnTo(w.rot, Math.atan2(dx, dz), 0.2); moving = true; }
    } else {
      const dx = w.x * 0.2 - w.x, dz = -50 - w.z, L = Math.hypot(dx, dz);
      w.x += dx / L * 3 * dt; w.z += dz / L * 3 * dt; w.rot = turnTo(w.rot, Math.atan2(dx, dz), 0.2); moving = true;
      if (w.z < -46) { scene.remove(w.g); w.bar.remove(); w.alive = false; wolves.splice(i, 1); continue; }
    }
    if (moving) w.walkT += dt;
    const sc = w.shake > 0 ? 1 + Math.sin((w.shake -= dt) * 40) * 0.08 : 1;
    w.g.position.set(w.x, 0, w.z); w.g.rotation.y = w.rot; w.g.scale.setScalar(sc);
    const a = Math.sin(w.walkT * 10) * 0.6; w.legs[0].rotation.x = w.legs[3].rotation.x = a; w.legs[1].rotation.x = w.legs[2].rotation.x = -a;
    setBar(w.bar, w.hp / w.max, w.x, 1.9, w.z);
  }

  /* --- flyers / particles / floats --- */
  for (let i = flyers.length - 1; i >= 0; i--) {
    const f = flyers[i]; f.t += dt; const k = Math.min(1, f.t / f.dur);
    const to = typeof f.to === 'function' ? f.to() : f.to;
    f.mesh.position.lerpVectors(f.from, to, k); f.mesh.position.y += Math.sin(k * Math.PI) * f.arc;
    f.mesh.rotation.y += dt * 8;
    if (k >= 1) { flyers.splice(i, 1); f.done && f.done(); }
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.t += dt; p.vy -= 14 * dt;
    p.m.position.x += p.vx * dt; p.m.position.y = Math.max(0.07, p.m.position.y + p.vy * dt); p.m.position.z += p.vz * dt;
    p.m.scale.setScalar(Math.max(0.01, 1 - p.t / p.life));
    if (p.t > p.life) { scene.remove(p.m); parts.splice(i, 1); }
  }
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i]; f.t += dt; f.y += dt * 1.6;
    const [sx, sy] = toScreen(f.x, f.y, f.z);
    f.d.style.transform = `translate(${sx | 0}px,${sy | 0}px) translate(-50%,-50%)`; f.d.style.opacity = String(Math.min(1, 2.2 - f.t * 2.2));
    if (f.t > 1) { f.d.remove(); floats.splice(i, 1); }
  }

  /* --- goals & guide --- */
  let g = goal();
  while (g.done && S.step < 7) { S.step++; if (S.step === 6) S.waveT = 70; g = goal(); }
  $('questTxt').textContent = g.txt;
  const tgt = g.tgt;
  if (tgt) {
    guide.visible = true; guide.position.set(tgt.x, 3.0 + Math.sin(time * 5) * 0.25 + (tgt.kind === 'tree' ? 1.2 : 0), tgt.z);
    guide.rotation.y += dt * 2;
    const dx = tgt.x - player.x, dz = tgt.z - player.z, L = Math.hypot(dx, dz);
    pointerG.visible = L > 3.2;
    if (pointerG.visible) { pointerG.position.set(player.x + dx / L * 1.55, 0.06, player.z + dz / L * 1.55); pointerG.rotation.y = Math.atan2(dx, dz) + Math.PI; pointer.rotation.z = 0; pointerG.rotation.y = Math.atan2(-dx, -dz); }
  } else { guide.visible = false; pointerG.visible = false; }

  /* --- HUD --- */
  syncCash();
  const now = { cash: S.wallet, log: carry.log.length, meat: carry.meat.length, ore: carry.ore.length };
  for (const k in now) if (now[k] !== shown[k]) { vals[k].textContent = now[k]; shown[k] = now[k]; }
  fullBadge.hidden = room() > 0 || carried() === 0;
  if (!fullBadge.hidden) place(fullBadge, player.x, 2.4 + Math.max(carry.log.length * ITEM_H.log, carry.meat.length * ITEM_H.meat, carry.ore.length * ITEM_H.ore, cashShown * ITEM_H.cash) + 1, player.z);
  if (defenseOn) {
    $('wallTxt').textContent = Math.ceil(S.wallHP) + ' / ' + S.wallMax;
    $('wallBar').style.width = (S.wallHP / S.wallMax * 100) + '%';
    $('waveTxt').textContent = S.raidOn ? 'NOW!' : (Math.floor(S.waveT / 60) + ':' + String(Math.floor(S.waveT % 60)).padStart(2, '0'));
  }
  if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) $('banner').classList.remove('on'); }

  /* --- fire & snow --- */
  flame.scale.set(1 + Math.sin(time * 13) * 0.08, 1 + Math.sin(time * 17) * 0.15, 1);
  const sp = snowGeo.attributes.position.array;
  for (let i = 0; i < SNOW_N; i++) {
    sp[i * 3 + 1] -= dt * 1.6; sp[i * 3] += Math.sin(time + i) * dt * 0.3;
    if (sp[i * 3 + 1] < 0) { sp[i * 3 + 1] = 18; sp[i * 3] = rand(-20, 20); sp[i * 3 + 2] = rand(-20, 20); }
  }
  snowGeo.attributes.position.needsUpdate = true;

  /* --- camera --- */
  camTarget.x += (player.x - camTarget.x) * Math.min(1, dt * 6);
  camTarget.z += (player.z - camTarget.z) * Math.min(1, dt * 6);
  camera.position.copy(camTarget).add(CAM_OFF); camera.lookAt(camTarget);
  snow.position.set(camTarget.x, 0, camTarget.z);
  sun.position.copy(camTarget).add(SUN_OFF); sun.target.position.copy(camTarget);
}

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(t => { last = t; frame(t); });

// test hook
window.__frost = { S, player, carry, stalls, pads, trees, yaks, wolves, goal };
})();
