<title>Frosthold Outpost</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800&display=swap">
<style>
/* Layout: full-bleed 3D canvas; goal + town status stacked top-left, resources top-right, hero bar over the player. Single deliberate frosty look. */
:root{
  --ice:#e9eff8; --ink:#16233a; --panel:rgba(18,30,50,.76); --panel-line:rgba(255,255,255,.18);
  --ember:#ff8a3d; --cash:#43b96a; --wood:#a8693f; --meat:#d9524b; --gold:#f2c14e; --stone:#9aa3ad; --hp:#e2483f;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ice);color:var(--ink);overflow:hidden;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:var(--body)}
#game{position:fixed;inset:0;background:var(--ice)}
#game canvas{display:block;width:100%;height:100%}
#ov{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#bliz{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 2s;
  background:radial-gradient(ellipse at center,rgba(255,255,255,0) 35%,rgba(235,242,252,.95) 100%)}
.hud{position:fixed;pointer-events:none;z-index:5}
#res{top:calc(8px + env(safe-area-inset-top,0px));right:calc(8px + env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.chip{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--panel-line);border-radius:11px;
  padding:3px 10px 3px 5px;min-width:72px;justify-content:space-between;color:#fff;font:19px/1 var(--display);
  font-variant-numeric:tabular-nums;letter-spacing:.02em;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.chip.bump{animation:bump .18s ease-out}
@keyframes bump{50%{transform:scale(1.12)}}
.ico{width:24px;height:19px;display:block;flex:none}
#left{top:calc(8px + env(safe-area-inset-top,0px));left:calc(8px + env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;width:min(58vw,270px)}
.card{background:var(--panel);border:1px solid var(--panel-line);border-radius:13px;padding:7px 11px;color:#fff}
#quest{font:800 14px/1.28 var(--body);text-wrap:balance}
#quest b{display:block;font:12px/1 var(--display);letter-spacing:.14em;color:var(--ember);margin-bottom:4px;text-transform:uppercase}
#quest.alert{border-color:#ff8b7e;box-shadow:0 0 0 2px rgba(226,72,63,.45)}
#quest.alert b{color:#ff8b7e}
#town{display:flex;flex-direction:column;gap:5px;font:800 11px/1 var(--body);font-variant-numeric:tabular-nums}
#town .row{display:flex;justify-content:space-between;align-items:center;gap:8px;letter-spacing:.05em;text-transform:uppercase}
#town .row .k{opacity:.8}
#thName{font:15px/1 var(--display);letter-spacing:.06em;color:#ffd9b8;text-transform:uppercase}
.meter{display:grid;grid-template-columns:52px 1fr 30px;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.05em}
.bar{height:8px;border-radius:5px;background:rgba(255,255,255,.18);overflow:hidden}
.bar i{display:block;height:100%;width:0;transition:width .25s}
#warmBar{background:linear-gradient(90deg,#ff6a3d,#ffb347)} #foodBar{background:linear-gradient(90deg,#c9433d,#ef8a6a)}
#xpBar{background:var(--gold)}
.meter.low span:first-child{color:#ff8b7e}
#status{color:#ffd166}
#banner{top:30%;left:50%;transform:translate(-50%,-50%) scale(.9);opacity:0;transition:all .25s;font:32px/1.05 var(--display);color:#fff;
  text-shadow:0 3px 0 #7a1d16,0 6px 18px rgba(0,0,0,.35);-webkit-text-stroke:1.5px #7a1d16;text-align:center;width:92vw}
#banner small{display:block;font-size:17px;margin-top:6px;-webkit-text-stroke:1px #7a1d16}
#banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#banner.good{text-shadow:0 3px 0 #1d5a33,0 6px 18px rgba(0,0,0,.3);-webkit-text-stroke-color:#1d5a33}
#banner.good small{-webkit-text-stroke-color:#1d5a33}
#mute{pointer-events:auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));right:calc(14px + env(safe-area-inset-right,0px));
  width:44px;height:44px;border-radius:50%;border:1px solid var(--panel-line);background:var(--panel);color:#fff;font:18px/1 var(--display);cursor:pointer}
#newg{pointer-events:auto;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:calc(14px + env(safe-area-inset-left,0px));
  border:1px solid var(--panel-line);background:var(--panel);color:#fff;font:13px/1 var(--display);letter-spacing:.06em;padding:9px 12px;border-radius:12px;cursor:pointer}
#newg.confirm{background:#b8452e}
#mute:focus-visible,#again:focus-visible,#newg:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
#hint{bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);color:var(--ink);opacity:.7;
  font:800 13px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;transition:opacity .6s;white-space:nowrap}
#joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(22,35,58,.16);
  border:2px solid rgba(255,255,255,.7);pointer-events:none;display:none;z-index:6}
#joy i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.25)}
#over{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(16,26,44,.72);padding:0 16px}
#over .box{background:#f4f7fc;color:var(--ink);border-radius:18px;padding:22px 22px 18px;max-width:340px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35)}
#over h2{margin:0 0 6px;font:30px/1.05 var(--display);color:#7a1d16}
#over p{margin:0 0 14px;font:700 15px/1.4 var(--body)}
#again{border:0;border-radius:12px;background:var(--ember);color:#fff;font:20px/1 var(--display);padding:12px 22px;cursor:pointer;box-shadow:0 4px 0 #a6501c}
.ft{position:absolute;left:0;top:0;font:19px/1 var(--display);color:#fff;white-space:nowrap;
  text-shadow:0 2px 0 rgba(0,0,0,.45);-webkit-text-stroke:1px rgba(0,0,0,.35);will-change:transform}
.ft.cash{color:#7cf0a0}.ft.warn{color:#ffd166}.ft.bad{color:#ff8b7e}.ft.xp{color:#ffe08a}
.bar3{position:absolute;left:0;top:0;width:52px;height:7px;border-radius:5px;background:rgba(20,25,35,.55);overflow:hidden;border:1.5px solid rgba(255,255,255,.8)}
.bar3 i{display:block;height:100%;background:var(--hp)}
.bar3.me i{background:#58c46d}.bar3.wall i{background:#f3b13f}.bar3.ally i{background:#5aa8e8}
.bubble{position:absolute;left:0;top:0;display:flex;align-items:center;gap:4px;padding:4px 9px 4px 5px;border-radius:16px;background:#fff;
  color:var(--ink);font:19px/1 var(--display);box-shadow:0 3px 0 rgba(0,0,0,.15)}
.bubble:after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fff}
.tag{position:absolute;left:0;top:0;padding:3px 8px;border-radius:8px;background:var(--panel);color:#fff;font:13px/1 var(--display);letter-spacing:.05em;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.chip.bump{animation:none}#banner{transition:none}}
</style>

<div id="game"></div>
<div id="bliz"></div>
<div id="ov"></div>
<div id="joy"><i></i></div>

<div id="left" class="hud">
  <div id="quest" class="card"><b id="questHead">Goal</b><span id="questTxt">Chop trees to gather logs</span></div>
  <div id="town" class="card">
    <div class="row"><span id="thName">Camp</span><span><span class="k">Pop</span> <span id="popTxt">6/6</span></span></div>
    <div class="meter" id="mWarm"><span>Warmth</span><div class="bar"><i id="warmBar"></i></div><span id="warmTxt">0</span></div>
    <div class="meter" id="mFood"><span>Food</span><div class="bar"><i id="foodBar"></i></div><span id="foodTxt">—</span></div>
    <div class="meter"><span>Hero <span id="lvTxt">1</span></span><div class="bar"><i id="xpBar"></i></div><span id="xpPct">0%</span></div>
    <div class="row"><span class="k">Next raid</span><span id="waveTxt">—</span></div>
    <div class="row" id="status" hidden></div>
  </div>
</div>

<div id="res" class="hud">
  <div class="chip" id="cCash"><svg class="ico" viewBox="0 0 28 22"><rect x="2" y="4" width="24" height="14" rx="2" fill="#43b96a" stroke="#1f6b3a" stroke-width="2"/><circle cx="14" cy="11" r="4" fill="#bff0cd"/></svg><span id="vCash">0</span></div>
  <div class="chip" id="cLog"><svg class="ico" viewBox="0 0 28 22"><rect x="3" y="5" width="18" height="12" rx="3" fill="#a8693f" stroke="#5b3416" stroke-width="2"/><ellipse cx="21" cy="11" rx="5" ry="6" fill="#e8c28f" stroke="#5b3416" stroke-width="2"/><circle cx="21" cy="11" r="2" fill="none" stroke="#a8693f" stroke-width="1.5"/></svg><span id="vLog">0</span></div>
  <div class="chip" id="cMeat"><svg class="ico" viewBox="0 0 28 22"><ellipse cx="13" cy="11" rx="10" ry="7" fill="#d9524b" stroke="#7a1f1a" stroke-width="2"/><ellipse cx="11" cy="10" rx="4" ry="2.5" fill="#f6c3b6"/><rect x="21" y="9" width="6" height="4" rx="2" fill="#f4ede0" stroke="#7a1f1a" stroke-width="1.5"/></svg><span id="vMeat">0</span></div>
  <div class="chip" id="cStone"><svg class="ico" viewBox="0 0 28 22"><path d="M4 17 L7 6 L18 4 L25 13 L17 19 Z" fill="#9aa3ad" stroke="#4b535e" stroke-width="2" stroke-linejoin="round"/><path d="M9 8 L15 7 L12 11 Z" fill="#cfd5dc"/></svg><span id="vStone">0</span></div>
  <div class="chip" id="cOre"><svg class="ico" viewBox="0 0 28 22"><path d="M4 16 L9 6 L22 6 L25 16 Z" fill="#f2c14e" stroke="#8a6410" stroke-width="2" stroke-linejoin="round"/><path d="M10 8 L15 8 L13 12 Z" fill="#fff3c4"/></svg><span id="vOre">0</span></div>
</div>

<div id="banner" class="hud"></div>
<div id="hint" class="hud">Drag anywhere to move</div>
<button id="mute" class="hud" type="button" aria-label="Toggle sound">♪</button>
<button id="newg" class="hud" type="button">New game</button>
<div id="over" hidden><div class="box"><h2 id="overHead">Frosthold has fallen</h2><p id="overTxt"></p><button id="again" type="button">Rebuild</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
/* =====================================================================
   FROSTHOLD OUTPOST
   Survive the frost: keep villagers warm (firewood) and fed (meat), secure
   the square fort, then upgrade the Town Hall to expand into bigger rings.
   ===================================================================== */
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const d2 = (ax, az, bx, bz) => (ax - bx) * (ax - bx) + (az - bz) * (az - bz);
const $ = id => document.getElementById(id);
const ROMAN = ['', 'I', 'II', 'III'];

/* ================= renderer / scene ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
$('game').appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9eff8);
const CAM_OFF = new THREE.Vector3(9, 24, 17);
const camera = new THREE.OrthographicCamera(-10, 10, 10, -10, 0.1, 200);
const camTarget = new THREE.Vector3(0, 0, 8);
const PAD_ROT = Math.atan2(CAM_OFF.x, CAM_OFF.z);
const FWD = new THREE.Vector2(-CAM_OFF.x, -CAM_OFF.z).normalize();
const RIGHT = new THREE.Vector2(-FWD.y, FWD.x);
function resize() {
  const w = window.innerWidth, h = window.innerHeight, a = w / h;
  const halfH = Math.max(8.5, 6.6 / a), halfW = halfH * a;
  camera.left = -halfW; camera.right = halfW; camera.top = halfH; camera.bottom = -halfH;
  camera.updateProjectionMatrix(); renderer.setSize(w, h);
}
window.addEventListener('resize', resize); resize();
scene.add(new THREE.HemisphereLight(0xffffff, 0xaab8d4, 0.72));
const sun = new THREE.DirectionalLight(0xfff1de, 0.62);
sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -24, right: 24, top: 24, bottom: -24, near: 1, far: 90 });
sun.shadow.bias = -0.0015;
scene.add(sun, sun.target);
const SUN_OFF = new THREE.Vector3(-12, 26, 10);

/* ================= materials / geometry ================= */
const mats = {};
function mat(c) { return mats[c] || (mats[c] = new THREE.MeshPhongMaterial({ color: c, flatShading: true, shininess: 0, specular: 0 })); }
function mk(geo, c, cast = true, recv = false) { const m = new THREE.Mesh(geo, mat(c)); m.castShadow = cast; m.receiveShadow = recv; return m; }
const Box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const Cyl = (a, b, h, s = 8) => new THREE.CylinderGeometry(a, b, h, s);
const Cone = (r, h, s = 8) => new THREE.ConeGeometry(r, h, s);
const basic = c => new THREE.MeshBasicMaterial({ color: c });

const RES = ['log', 'stone', 'ore', 'meat', 'cash'];
const COLOR = { cash: 0x43b96a, log: 0xa8693f, meat: 0xd9524b, ore: 0xf2c14e, stone: 0x9aa3ad };
const ITEM_H = { cash: 0.085, log: 0.24, meat: 0.14, ore: 0.2, stone: 0.22 };
const VIS = { log: 45, meat: 60, ore: 45, stone: 45 };
const GEO = {
  cash: Box(0.5, 0.075, 0.28),
  log: (() => { const g = Cyl(0.12, 0.12, 0.52, 7); g.rotateZ(Math.PI / 2); return g; })(),
  meat: Cyl(0.21, 0.19, 0.12, 9),
  ore: Box(0.42, 0.18, 0.26),
  stone: new THREE.DodecahedronGeometry(0.17, 0),
};
function itemMesh(t) { const m = new THREE.Mesh(GEO[t], mat(COLOR[t])); m.castShadow = true; return m; }
const resName = t => t === 'ore' ? 'gold' : t;

/* ================= world constants ================= */
const C = { x: 0, z: 10 };                // fort centre
const TIERS = [12, 21, 30];               // half-size of each fort ring
const GATE_HW = 2.5;
const BOUNDS = { x0: -46, x1: 46, z0: -47, z1: 50 };
const DOOR = { x: 0, z: 12.5 };           // town hall door
const inSquare = (x, z, h, m = 0) => Math.abs(x - C.x) < h + m && Math.abs(z - C.z) < h + m;

const ground = mk(new THREE.PlaneGeometry(260, 260), 0xf4f7fc, false, true);
ground.rotation.x = -Math.PI / 2; scene.add(ground);
function flat(w, d, c, x, z, y = 0.012) { const m = mk(new THREE.PlaneGeometry(w, d), c, false, true); m.rotation.x = -Math.PI / 2; m.position.set(x, y, z); scene.add(m); return m; }
flat(23, 23, 0xe6dccb, 0, 10, 0.011);
flat(5, 40, 0xe2e7f0, 0, -20, 0.01);
flat(7, 6, 0xd8c3a0, 0, 9.5, 0.013);
const lake = mk(new THREE.CircleGeometry(7, 9), 0xc6dcef, false, true); lake.rotation.x = -Math.PI / 2; lake.position.set(-24, 0.015, 45); scene.add(lake);

const obstacles = [];
function addObs(x, z, r, on) { const o = { x, z, r, on: on || (() => true) }; obstacles.push(o); return o; }

/* ================= overlay helpers ================= */
const ov = $('ov');
const _v = new THREE.Vector3();
function toScreen(x, y, z) { _v.set(x, y, z).project(camera); return [(_v.x + 1) / 2 * window.innerWidth, (1 - _v.y) / 2 * window.innerHeight]; }
function place(el, x, y, z) { const [sx, sy] = toScreen(x, y, z); el.style.transform = `translate(${sx | 0}px,${sy | 0}px) translate(-50%,-100%)`; }
const floats = [];
function floatText(txt, x, y, z, cls) { if (loading) return; const d = document.createElement('div'); d.className = 'ft ' + (cls || ''); d.textContent = txt; ov.appendChild(d); floats.push({ d, x, y, z, t: 0 }); }
function makeBar(cls) { const d = document.createElement('div'); d.className = 'bar3 ' + (cls || ''); d.innerHTML = '<i></i>'; d.hidden = true; ov.appendChild(d); return d; }
function setBar(bar, f, x, y, z) { bar.hidden = false; bar.firstChild.style.width = (clamp(f, 0, 1) * 100) + '%'; place(bar, x, y, z); }
let bannerT = 0, loading = false;
function banner(txt, good, sub) { if (loading) return; const b = $('banner'); b.innerHTML = ''; b.append(txt); if (sub) { const s = document.createElement('small'); s.textContent = sub; b.append(s); } b.className = 'hud on' + (good ? ' good' : ''); bannerT = sub ? 3.4 : 2.4; }
let lastNote = 0;
function note(txt, cls = 'warn') { const now = performance.now(); if (now - lastNote > 900) { lastNote = now; floatText(txt, player.x, 3.4, player.z, cls); } }

/* ================= sound ================= */
let actx = null, muted = false, lastSfx = 0;
function sfx(f, d = 0.07, type = 'triangle', vol = 0.05) {
  if (!actx || muted || loading) return;
  const now = actx.currentTime; if (now - lastSfx < 0.03) return; lastSfx = now;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, now); o.frequency.exponentialRampToValueAtTime(f * 1.4, now + d);
  g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.0001, now + d);
  o.connect(g); g.connect(actx.destination); o.start(now); o.stop(now + d + 0.02);
}
$('mute').addEventListener('click', e => { e.stopPropagation(); muted = !muted; $('mute').textContent = muted ? '×' : '♪'; });
$('again').addEventListener('click', () => { clearSave(); location.reload(); });

/* ================= particles & flyers ================= */
const parts = [];
const partGeo = Box(0.14, 0.14, 0.14);
function burst(x, y, z, c, n = 6, sp = 3) {
  for (let i = 0; i < n; i++) { const m = new THREE.Mesh(partGeo, mat(c)); m.position.set(x, y, z); scene.add(m); parts.push({ m, vx: rand(-sp, sp), vy: rand(2, 5), vz: rand(-sp, sp), t: 0, life: rand(0.4, 0.7) }); }
}
const flyers = [];
function fly(mesh, to, dur, arc, done) { flyers.push({ mesh, from: mesh.position.clone(), to, t: 0, dur, arc, done }); }
const growing = [];
function popIn(g) { g.scale.setScalar(0.01); growing.push({ g, t: 0 }); }

/* ================= trees & rocks ================= */
const vcMat = new THREE.MeshPhongMaterial({ vertexColors: true, flatShading: true, shininess: 0, specular: 0 });
function mergeParts(parts) {
  const pos = [], nor = [], col = [], c = new THREE.Color(), m = new THREE.Matrix4();
  for (const [geo, color, x, y, z, ry] of parts) {
    const g = geo.toNonIndexed(); m.makeRotationY(ry || 0).setPosition(x, y, z); g.applyMatrix4(m); c.setHex(color);
    const pa = g.attributes.position.array, na = g.attributes.normal.array;
    for (let i = 0; i < pa.length; i++) { pos.push(pa[i]); nor.push(na[i]); }
    for (let i = 0; i < pa.length / 3; i++) col.push(c.r, c.g, c.b);
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  out.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  return out;
}
const TREE_GEOS = [0x2f7a69, 0x3b8c76, 0x2a6c66].map(col => mergeParts([
  [Cyl(0.18, 0.24, 0.9, 6), 0x7b4a2b, 0, 0.45, 0], [Cone(1.25, 1.5, 7), col, 0, 1.35, 0, 0.3],
  [Cone(1.0, 1.3, 7), col, 0, 2.05, 0, 0.9], [Cone(0.7, 1.1, 7), col, 0, 2.7, 0, 0.5],
  [Cyl(0.9, 1.05, 0.12, 7), 0xf7fbff, 0, 1.62, 0], [Cone(0.42, 0.55, 7), 0xffffff, 0, 3.15, 0]]));
const stumpGeo = Cyl(0.24, 0.28, 0.3, 7);
const trees = [], rocks = [];
function clearSpot(x, z) {
  if (inSquare(x, z, TIERS[0], 2.5)) return false;
  if (Math.abs(x) < 3.5 && z < C.z) return false;
  if (x > 8 && x < 44 && z < -26) return false;
  if (x > -27 && x < -3 && z < -36) return false;
  if (z > 42 || x < -45.5 || x > 45.5 || z < -46) return false;
  return true;
}
function addTree(x, z, s, choppable) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.scale.setScalar(s); scene.add(g);
  const top = new THREE.Mesh(TREE_GEOS[(Math.random() * 3) | 0], vcMat); top.castShadow = choppable; top.rotation.y = Math.random() * TAU; g.add(top);
  const stump = mk(stumpGeo, 0x8a5634); stump.position.y = 0.15; stump.visible = false; g.add(stump);
  const t = { x, z, g, top, stump, hp: 4, max: 4, alive: true, gone: false, respawn: 0, shake: 0, grow: 1, choppable, kind: 'tree' };
  t.obs = addObs(x, z, 0.3 * s, () => t.alive);
  trees.push(t);
}
function addRock(x, z, kind) {
  const g = new THREE.Group(); g.position.set(x, 0, z); scene.add(g);
  const b = mk(new THREE.DodecahedronGeometry(0.95, 0), kind === 'gold' ? 0x7d8794 : 0xa3adbb); b.position.y = 0.6; b.scale.set(1.15, 0.85, 1); b.rotation.y = rand(0, 3); g.add(b);

  hunter: { coat: 0x7a5230, hat: 0x2f3f24, item: 'meat', cap: 10, speed: 3.9, hit: 0.6, reach: 1.9 },

function spawnWorker(role, x, z) {
  const R = ROLES[role]; const p = makePerson(R.coat, 0xf3e6cf, R.hat);
  p.g.position.set(x, 0, z); scene.add(p.g);
  const tool = makeAxe(); tool.position.set(0.45, 0.9, 0.15); tool.rotation.z = -0.5; p.g.add(tool);
  const sg = new THREE.Group(); sg.position.set(0, 1.25, -0.5); p.g.add(sg);
  workers.push({ ...p, role, R, x, z, rot: 0, tool, sg, items: [], state: 'seek', tgt: null, t: 0, walkT: 0, idx: workers.length, kind: 'worker' });
  burst(x, 1, z, R.coat, 10); floatText(role[0].toUpperCase() + role.slice(1) + ' hired', x, 2.6, z, 'xp');
}
function workerTake(w, n) { for (let i = 0; i < n && w.items.length < w.R.cap; i++) { const m = itemMesh(w.R.item); m.position.set(0, w.items.length * ITEM_H[w.R.item], 0); w.sg.add(m); w.items.push(m); } }
function findWork(w) {
  const taken = new Set(workers.filter(o => o !== w && o.tgt).map(o => o.tgt));
  let list;
  if (w.role === 'logger') list = trees.filter(t => t.alive && !t.gone && t.choppable);
  else if (w.role === 'hunter') list = yaks.filter(y => y.alive);
  else if (w.role === 'stonecutter') list = rocks.filter(r => r.alive && r.kind === 'stone');
  else list = rocks.filter(r => r.alive && !r.hidden && r.kind === 'gold');
  let b = null, bd = 1e9;
  for (const t of list) { const d = d2(t.x, t.z, w.x, w.z) + (taken.has(t) ? 500 : 0); if (d < bd) { bd = d; b = t; } }
  return b;
}
function workerDest(w) {
  if (w.R.item === 'log') return fireStall;
  if (w.R.item === 'meat') return cookStall.unlocked ? cookStall : null;
  if (w.R.item === 'stone') return storehouse ? 'store' : null;
  return goldStall.unlocked ? goldStall : (storehouse ? 'store' : null);
}

    e.g.position.set(e.x, 0, e.z); e.g.rotation.y = e.rot; e.g.scale.setScalar(sc);
    const a = Math.sin(e.walkT * (e.type === 'yeti' ? 5 : 10)) * 0.6; e.legs[0].rotation.x = e.legs[3].rotation.x = a; e.legs[1].rotation.x = e.legs[2].rotation.x = -a;
    setBar(e.bar, e.hp / e.max, e.x, e.type === 'yeti' ? 4 : 1.9, e.z);
  }

  /* --- flyers / particles / floats / growth --- */
  for (let i = flyers.length - 1; i >= 0; i--) {
    const f = flyers[i]; f.t += dt; const k = Math.min(1, f.t / f.dur), to = typeof f.to === 'function' ? f.to() : f.to;
    f.mesh.position.lerpVectors(f.from, to, k); f.mesh.position.y += Math.sin(k * Math.PI) * f.arc; f.mesh.rotation.y += dt * 8;
    if (k >= 1) { flyers.splice(i, 1); f.done && f.done(); }
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.t += dt; p.vy -= 14 * dt;
    p.m.position.x += p.vx * dt; p.m.position.y = Math.max(0.07, p.m.position.y + p.vy * dt); p.m.position.z += p.vz * dt; p.m.scale.setScalar(Math.max(0.01, 1 - p.t / p.life));
    if (p.t > p.life) { scene.remove(p.m); parts.splice(i, 1); }
  }
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i]; f.t += dt; f.y += dt * 1.4; const [sx, sy] = toScreen(f.x, f.y, f.z);
    f.d.style.transform = `translate(${sx | 0}px,${sy | 0}px) translate(-50%,-50%)`; f.d.style.opacity = String(Math.min(1, 2.6 - f.t * 2));
    if (f.t > 1.3) { f.d.remove(); floats.splice(i, 1); }
  }
  for (let i = growing.length - 1; i >= 0; i--) { const g = growing[i]; g.t = Math.min(1, g.t + dt * 2.2); const k = g.t, s = 1 + 2.2 * Math.pow(k - 1, 3) + 1.2 * Math.pow(k - 1, 2); g.g.scale.setScalar(Math.max(0.01, s)); if (k >= 1) { g.g.scale.setScalar(1); growing.splice(i, 1); } }

  /* --- goals & guide --- */
  let g = goal();
  while (g.done && S.step < 3) { S.step++; g = goal(); }
  $('questTxt').textContent = g.txt; $('questHead').textContent = g.alert ? 'Danger' : 'Goal'; $('quest').classList.toggle('alert', !!g.alert);
  const tgt = g.tgt;
  if (tgt && S.downT <= 0) {
    guide.visible = true; guide.position.set(tgt.x, 3.0 + Math.sin(time * 5) * 0.25 + (tgt.kind === 'tree' ? 1.2 : 0), tgt.z); guide.rotation.y += dt * 2;
    const dx = tgt.x - player.x, dz = tgt.z - player.z, L = Math.hypot(dx, dz);
    pointerG.visible = L > 3.2;
    if (pointerG.visible) { pointerG.position.set(player.x + dx / L * 1.55, 0.06, player.z + dz / L * 1.55); pointerG.rotation.y = Math.atan2(-dx, -dz); }
  } else { guide.visible = false; pointerG.visible = false; }

  /* --- HUD --- */
  syncCash();
  const now = { cash: S.wallet, log: carry.log.length, meat: carry.meat.length, ore: carry.ore.length, stone: carry.stone.length };
  for (const k in now) if (now[k] !== shown[k]) { vals[k].textContent = now[k]; shown[k] = now[k]; }
  $('thName').textContent = ['', 'Camp', 'Town', 'Citadel'][S.th] + ' · TH ' + ROMAN[S.th];
  $('popTxt').textContent = P + '/' + housing();
  const wf = S.warm / warmCap(), ff = S.cook ? S.food / foodCap() : 0;
  $('warmBar').style.width = (wf * 100) + '%'; $('warmTxt').textContent = Math.round(wf * 100) + '%'; $('mWarm').classList.toggle('low', wf < 0.25);
  $('foodBar').style.width = (ff * 100) + '%'; $('foodTxt').textContent = S.cook ? Math.round(ff * 100) + '%' : '—'; $('mFood').classList.toggle('low', S.cook && ff < 0.25);
  $('lvTxt').textContent = S.lvl; $('xpBar').style.width = (S.xp / xpNeed(S.lvl) * 100) + '%'; $('xpPct').textContent = Math.floor(S.xp / xpNeed(S.lvl) * 100) + '%';
  $('waveTxt').textContent = !raidsOn ? '—' : S.raidOn ? 'Now!' : Math.floor(S.waveT / 60) + ':' + String(Math.floor(S.waveT % 60)).padStart(2, '0');
  const st = $('status'); const msg = freezing ? 'Freezing! Villagers are dying' : starving ? 'Starving! Villagers are dying' : S.blizOn > 0 ? 'Blizzard ' + Math.ceil(S.blizOn) + 's' : (P >= housing() && S.cook ? 'Housing full: build houses' : '');
  st.hidden = !msg; st.textContent = msg;
  if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) $('banner').classList.remove('on'); }

  /* --- snow, camera --- */
  const sp = snowGeo.attributes.position.array, fall = S.blizOn > 0 ? 5 : 1.6, drift = S.blizOn > 0 ? 4 : 0.3;
  for (let i = 0; i < SNOW_N; i++) {
    sp[i * 3 + 1] -= dt * fall; sp[i * 3] += (Math.sin(time + i) * 0.3 + (S.blizOn > 0 ? 1 : 0)) * dt * drift;
    if (sp[i * 3 + 1] < 0) { sp[i * 3 + 1] = 18; sp[i * 3] = rand(-20, 20); sp[i * 3 + 2] = rand(-20, 20); }
  }
  snowGeo.attributes.position.needsUpdate = true;
  camTarget.x += (player.x - camTarget.x) * Math.min(1, dt * 6); camTarget.z += (player.z - camTarget.z) * Math.min(1, dt * 6);
  camera.position.copy(camTarget).add(CAM_OFF); camera.lookAt(camTarget);
  snow.position.set(camTarget.x, 0, camTarget.z);
  sun.position.copy(camTarget).add(SUN_OFF); sun.target.position.copy(camTarget);
}


/* ================= save / load (this browser only) ================= */
const SAVE_KEY = 'frosthold-save-v1';
const WORKER_HOME = { logger: [6, 18.5], hunter: [16.5, 16.3], stonecutter: [-16.5, 25.4], miner: [-25.5, -10] };
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }
function saveGame() {
  if (S.over || loading) return;
  const data = {
    v: 1, S: Object.assign({}, S, { raidOn: false, downT: 0 }), B: Object.assign({}, B),
    player: [player.x, player.z],
    carry: { log: carry.log.length, meat: carry.meat.length, ore: carry.ore.length, stone: carry.stone.length },
    pads: pads.map(p => [p.level, p.done ? 1 : 0, p.paid]),
    rings: rings.map(r => [r.active ? 1 : 0, r.complete ? 1 : 0, r.segs.map(sg => [sg.built ? 1 : 0, Math.round(sg.hp), sg.broken ? 1 : 0, sg.stone ? 1 : 0])]),
    workers: workers.map(w => w.role), guards: guards.length,
    store: [store.stone, store.ore], pallets: pallets.map(P => P.amount), stock: stalls.map(st => st.stock),
  };
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch (e) {}
}
function loadGame() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) { d = null; }
  if (!d || d.v !== 1) return false;
  loading = true;
  try {
    // replay finished buildings (their effects), then restore the exact numbers
    for (const id in d.B) { const p = pads.find(q => q.id === id); if (p && p.rawBuy && !p.labels) { B[id] = true; p.rawBuy(1); } }
    Object.assign(S, d.S);
    d.pads.forEach(([lv, done, paid], i) => { const p = pads[i]; if (!p) return; p.level = lv; p.done = !!done; p.paid = paid || {}; drawPad(p); });
    d.rings.forEach(([act, comp, segs], i) => {
      const r = rings[i]; r.active = !!act; r.complete = !!comp;
      segs.forEach(([b, hp, br, st], j) => { const sg = r.segs[j]; if (!sg) return; sg.built = !!b; sg.stone = !!st; sg.max = segMax(sg); sg.hp = b ? Math.min(hp, sg.max) : 0; sg.broken = !!br; segVisual(sg); });
    });
    for (let i = 1; i < rings.length; i++) if (rings[i].complete) retireRing(i);
    modelTownHall();
    axe2.visible = S.axe >= 2; axe1.scale.setScalar(1 + (S.axe - 1) * 0.12); axe2.scale.copy(axe1.scale);
    pack.scale.setScalar(1 + S.bag * 0.15);
    for (const t of ['log', 'meat', 'ore', 'stone']) for (let i = 0; i < (d.carry[t] || 0); i++) addToStack(t);
    d.workers.forEach(role => { const [x, z] = WORKER_HOME[role] || [0, 8]; spawnWorker(role, x + rand(-1, 1), z); });
    for (let i = 0; i < d.guards; i++) spawnGuard(rand(-2, 2), outerRing().zN + 4);
    store.stone = d.store[0]; store.ore = d.store[1];
    d.pallets.forEach((a, i) => { if (pallets[i]) { pallets[i].amount = a; syncPallet(pallets[i]); } });
    d.stock.forEach((n, i) => { const st = stalls[i]; if (!st) return; st.stock = n; for (let k = 0; k < Math.min(n, 32); k++) { const cm = itemMesh(st.type); cm.position.copy(counterSlot(st, k)); scene.add(cm); st.counter.push(cm); } for (let k = 32; k < n; k++) st.counter.push(null); });
    player.x = d.player[0]; player.z = d.player[1];
    if (S.waveT < 30) S.waveT = 30;
    S.hp = heroMax();
  } catch (e) { loading = false; clearSave(); location.reload(); return false; }
  loading = false;
  banner('Welcome back!', true, 'Your town was saved in this browser');
  return true;
}
const newBtn = $('newg'); let newT = 0;
newBtn.addEventListener('click', e => {
  e.stopPropagation();
  if (newBtn.classList.contains('confirm')) { clearSave(); S.over = true; location.reload(); return; }
  newBtn.classList.add('confirm'); newBtn.textContent = 'Tap again to restart'; clearTimeout(newT);
  newT = setTimeout(() => { newBtn.classList.remove('confirm'); newBtn.textContent = 'New game'; }, 3000);
});
loadGame();
setInterval(saveGame, 8000);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); });
window.addEventListener('pagehide', saveGame);

let last = performance.now();
function frame(now) {
  let dt = Math.min(0.15, (now - last) / 1000); last = now;
  while (dt > 0.0001) { const step = Math.min(dt, 0.04); update(step); dt -= step; }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(t => { last = t; frame(t); });

window.__frost = { saveGame, waypoint, give: (t, n) => { for (let i = 0; i < n; i++) addToStack(t); }, S, player, carry, stalls, pads, trees, yaks, enemies, workers, guards, rocks, rings, store, B, goal, pallets, walkers, checkRings, setSegBuilt, padTH };
})();
